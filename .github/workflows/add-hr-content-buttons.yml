name: Add HR Content Buttons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-hr-content-buttons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Connect game cards to HR Content
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '<!-- LP-HR-CONTENT-BUTTONS -->'
          if marker not in s:
              addon = """<!-- LP-HR-CONTENT-BUTTONS -->\n<style>.lp-content-action{display:flex;justify-content:flex-end;padding:8px 8px 4px}.lp-content-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid #20c8f3;border-radius:10px;background:linear-gradient(135deg,#0cc4ed,#39ddff);color:#031522!important;text-decoration:none!important;padding:9px 14px;font-size:11px;font-weight:1000;letter-spacing:.08em}@media(max-width:560px){.lp-content-action{padding:6px 5px 3px}.lp-content-btn{width:100%;justify-content:center}}</style>\n<script>(function(){function add(){document.querySelectorAll('#games .game,.game').forEach(function(g,i){if(g.querySelector('.lp-content-action'))return;var pk=g.getAttribute('data-game-pk')||'';var d=document.createElement('div');d.className='lp-content-action';var a=document.createElement('a');a.className='lp-content-btn';a.textContent='CONTENT CARD';a.href='hr-content.html?game='+i+(pk?'&game_pk='+encodeURIComponent(pk):'');d.appendChild(a);(g.querySelector('.body')||g).appendChild(d)})}document.addEventListener('DOMContentLoaded',add);new MutationObserver(add).observe(document.documentElement,{childList:true,subtree:true});setTimeout(add,1000)})();</script>\n"""
              if '</body>' not in s:
                  raise SystemExit('index.html closing body not found')
              p.write_text(s.replace('</body>', addon + '</body>', 1))
          PY

      - name: Verify integration
        run: |
          grep -q 'LP-HR-CONTENT-BUTTONS' index.html
          grep -q 'CONTENT CARD' index.html

      - name: Commit website integration
        run: |
          git config user.name "launchpoint-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Connect HR game cards to Content page"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
