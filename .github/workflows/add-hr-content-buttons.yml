name: Add HR Content Buttons

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-hr-content-buttons.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix content card loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hr-content.html')
          s = p.read_text(encoding='utf-8')
          bad = "venue=F(g,['venue','park','stadium','ballpark'])??F(ps[0],['venue','park','stadium','ballpark'])||''"
          good = "venue=(F(g,['venue','park','stadium','ballpark'])??F(ps[0],['venue','park','stadium','ballpark']))||''"
          if bad in s:
              s = s.replace(bad, good, 1)
          elif good not in s:
              raise SystemExit('venue loader expression not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify content page
        shell: bash
        run: |
          grep -Fq "venue=(F(g,['venue','park','stadium','ballpark'])??F(ps[0],['venue','park','stadium','ballpark']))||''" hr-content.html
          grep -Fq "fetch('data/todays_top_hr_picks.json?ts='" hr-content.html

      - name: Commit
        shell: bash
        run: |
          git config user.name launchpoint-bot
          git config user.email actions@users.noreply.github.com
          git add hr-content.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix HR content card data loader"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
