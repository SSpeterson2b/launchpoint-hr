name: Redesign HR Content Card

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redesign-hr-content-card.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply visual redesign
        shell: bash
        run: |
          cat >> hr-content.html <<'EOF'
          <style id="lp-social-redesign">
          body{background:radial-gradient(circle at 50% 0,#0b3650 0,#061b2b 42%,#03121e 100%)}
          .top{max-width:960px;margin:auto;padding:22px 22px 15px}.logo{font-size:34px;letter-spacing:-1px}.sub{margin-top:4px;font-size:11px;letter-spacing:4px}
          .wrap{max-width:960px;padding:10px 14px 32px}.tabs{gap:9px;margin-bottom:14px}.tabs button{font-size:12px;padding:11px 18px;border-radius:25px;border:1px solid #2a7596;background:#08253a}.tabs .on{box-shadow:0 0 18px #19c4ed55}
          .card{aspect-ratio:4/3;border-radius:22px;border:2px solid #d8edf4;background:#f4fbfd;box-shadow:0 18px 55px #0009;grid-template-rows:34% 10% 17% 29% 10%}
          .hero{padding:8px 18px;background:linear-gradient(180deg,#eefbff 0 28%,rgba(226,245,250,.94) 28% 35%,rgba(79,121,91,.82) 35% 100%)}
          .hero:before{content:"";position:absolute;left:5%;right:5%;bottom:-18%;height:65%;border:2px solid rgba(255,255,255,.18);border-radius:50% 50% 0 0;pointer-events:none}
          .date{font-size:11px}.title{font-size:23px;letter-spacing:.5px}.match{grid-template-columns:1fr 70px 1fr}.teamLogo{height:78px;max-width:105px;filter:drop-shadow(0 4px 4px #0003)}.team{font-size:17px}.vs{font-size:28px}.venue{font-size:10px;padding:5px 15px}
          .weather>div{font-size:8px}.weather b{font-size:15px}.pitchers{gap:10px;padding:7px 12px}.pitcher{border-radius:12px;grid-template-columns:58px 1fr;padding:7px}.pitcher img{width:54px;height:62px}.pteam{font-size:7px}.pname{font-size:13px}.pstat{font-size:8px}
          .picks{padding:4px 12px}.picktitle{font-size:16px;height:22px}.pick{margin:3px 0;border-radius:9px;grid-template-columns:32px 36px 46px 1fr 48px 22px;padding:3px 7px;background:linear-gradient(90deg,#dbe9ed,#edf6f8)}.rank{font-size:13px;padding:7px 0}.teamMini{width:34px;height:34px}.pic{width:44px;height:44px;border-radius:7px}.pname2{font-size:12px}.meta{font-size:8px}.tag{font-size:7px;padding:2px 5px;border-radius:5px}.score{font-size:18px;padding:6px 2px;border:1px solid #d7e6eb}.bars{font-size:14px}
          .bottom{padding:6px 13px}.bottom b{font-size:10px}.why{font-size:7.5px;line-height:1.3}.slogan{font-size:10px}.slogan span{font-size:14px}.share{margin-top:14px;border-radius:16px;padding:15px;font-size:14px;box-shadow:0 8px 25px #19c2e933}
          @media(max-width:560px){.top{padding:15px 12px 10px}.logo{font-size:26px}.sub{font-size:8px}.wrap{padding:7px}.card{border-radius:15px}.title{font-size:15px}.teamLogo{height:52px}.team{font-size:11px}.match{grid-template-columns:1fr 42px 1fr}.vs{font-size:20px}.weather b{font-size:10px}.pitchers{padding:5px 7px;gap:6px}.pitcher{grid-template-columns:38px 1fr;padding:4px}.pitcher img{width:36px;height:43px}.pname{font-size:8.5px}.picktitle{font-size:11px;height:15px}.picks{padding:2px 7px}.pick{grid-template-columns:22px 24px 30px 1fr 31px 14px;padding:1px 3px;margin:2px 0}.teamMini{width:22px;height:22px}.pic{width:29px;height:29px}.pname2{font-size:8px}.meta{font-size:5.5px}.tag{font-size:5px;padding:1px 2px}.score{font-size:12px;padding:3px 0}.bottom{padding:3px 7px}.bottom b{font-size:7px}.why{font-size:5.5px}.slogan{font-size:7px}.slogan span{font-size:9px}}
          </style>
          EOF
      - name: Commit redesign
        shell: bash
        run: |
          git config user.name launchpoint-bot
          git config user.email actions@users.noreply.github.com
          git add hr-content.html
          git commit -m "Redesign HR content card" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
