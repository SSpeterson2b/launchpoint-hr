name: Repair HR Content and Player Props

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-content-props-live.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Player Props: start on a game that actually has usable player data,
          # and keep verified non-PLAY decisions visible rather than presenting an empty page.
          p = Path('player-props.html')
          s = p.read_text(encoding='utf-8')
          old = 'data=d;activeGame=String((d.games||[])[0]&&d.games[0].game_pk||"");document.querySelector("#status").textContent=d.status==="LIVE"?"MODEL LIVE":"MODEL WAITING";render()'
          new = '''data=d;var games=d.games||[];var firstUseful=games.find(function(g){return (g.props||[]).some(function(p){return !!p.player})||(g.long_shots||[]).some(function(p){return !!p.player})});var firstPlay=games.find(function(g){return (g.props||[]).some(function(p){return p.decision==="PLAY"&&!!p.player})});var start=firstPlay||firstUseful||games[0];activeGame=String(start&&start.game_pk||"");document.querySelector("#status").textContent=d.status==="LIVE"?"MODEL LIVE":"MODEL WAITING";render()'''
          if old not in s:
              raise SystemExit('Player Props startup block not found')
          s = s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # HR content: labels must come from model status, not row position.
          # Do not invent a 92/84/76 scale; show the live raw HR edge exactly as supplied.
          h = Path('hr-content.html')
          s = h.read_text(encoding='utf-8')
          old = "function tag(i){return i===0?['PRIMARY LAUNCH','']:i===1?['SECONDARY','s']:['VALUE','v']}"
          new = '''function tag(x,i){var v=String(x.pick_status||x.daily_tier||x.raw_classification||'').toUpperCase();if(v.indexOf('PRIMARY')>=0||v==='ELITE')return['PRIMARY LAUNCH',''];if(v.indexOf('SECONDARY')>=0||v==='STRONG')return['SECONDARY','s'];if(v.indexOf('VALUE')>=0)return['VALUE','v'];return i===0?['PRIMARY LAUNCH','']:i===1?['SECONDARY','s']:['VALUE','v']}'''
          if old not in s:
              raise SystemExit('HR tag function not found')
          s=s.replace(old,new,1)
          s=s.replace('var tg=tag(j),order=num(x.batting_order)', 'var tg=tag(x,j),order=num(x.batting_order)',1)

          # Correct starter association: each hitter row carries the opposing starter.
          old2="ap=pitcherFor(g,home),hp=pitcherFor(g,away)"
          new2="ap=pitcherFor(g,away),hp=pitcherFor(g,home)"
          if old2 not in s:
              raise SystemExit('HR pitcher mapping block not found')
          s=s.replace(old2,new2,1)

          # Support direct links by game_pk or game_key.
          old3="var q=new URLSearchParams(location.search),pk=q.get('game_pk'),idx=0;if(pk){var f=GAMES.findIndex(function(g){return String(g.game_pk)===String(pk)});if(f>=0)idx=f}render(idx)"
          new3="var q=new URLSearchParams(location.search),pk=q.get('game_pk'),gk=q.get('game_key'),idx=0;if(pk){var f=GAMES.findIndex(function(g){return String(g.game_pk)===String(pk)});if(f>=0)idx=f}else if(gk){var f2=GAMES.findIndex(function(g){var ss=sides(g);return (ss[0]+' vs '+ss[1])===gk||(ss[1]+' vs '+ss[0])===gk});if(f2>=0)idx=f2}render(idx)"
          if old3 in s:
              s=s.replace(old3,new3,1)
          h.write_text(s,encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          grep -Fq 'firstUseful' player-props.html
          grep -Fq 'function tag(x,i)' hr-content.html
          grep -Fq 'ap=pitcherFor(g,away),hp=pitcherFor(g,home)' hr-content.html

      - name: Commit repair
        shell: bash
        run: |
          git config user.name launchpoint-bot
          git config user.email actions@users.noreply.github.com
          git add player-props.html hr-content.html
          if ! git diff --cached --quiet; then
            git commit -m "Fix HR content accuracy and Player Props startup"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
