name: Test model target display

on:
  pull_request:
    paths:
      - scripts/generator-cards.js
      - parlays.html
      - test-generator-cards.cjs
      - player-props.html
      - index.html
      - test-model-targets.cjs
      - .github/workflows/test-model-targets.yml
  push:
    branches: [main]
    paths:
      - scripts/generator-cards.js
      - parlays.html
      - test-generator-cards.cjs
      - player-props.html
      - index.html
      - test-model-targets.cjs
      - .github/workflows/test-model-targets.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node test-model-targets.cjs
      - run: node test-generator-cards.cjs
