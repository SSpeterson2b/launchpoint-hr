<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LaunchPoint Game Edge</title>
<style>body .app{padding-bottom:175px}.pending{color:var(--gold)!important;font-size:18px!important}.starter-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;text-align:center;color:#8da4b2;font-size:12px;font-weight:800;margin-top:9px}.starter-row strong{display:block;color:#f5f7f8;font-size:13px;margin-top:3px}.reason{border:1px solid #173849;border-radius:9px;padding:11px 6px}.reason b{font-size:15px!important;margin-top:6px}.reason-empty{grid-column:1/-1;color:#8da4b2;padding:16px}.check.bad i{color:#ff6b72;border-color:#ff6b72}.hold-note{margin-top:8px;color:#9fb2bc;font-size:12px}.market-note{grid-column:1/-1;color:#839ba9;font-size:11px;margin-top:4px}@media(max-width:520px){body .app{padding-bottom:165px}.reasons{grid-template-columns:1fr}.reason-empty{grid-column:1}.starter-row{font-size:10px}}</style>
<style>
:root{--bg:#02080d;--panel:#06141d;--line:#173849;--cyan:#14c7e8;--gold:#ffbb21;--green:#7ce63b;--muted:#7892a2;--white:#f5f7f8}*{box-sizing:border-box}html,body{margin:0;background:#000;color:var(--white);font-family:Arial,Helvetica,sans-serif}body{min-height:100vh}.app{width:min(100%,680px);margin:auto;background:linear-gradient(135deg,#02070b,#03131c);min-height:100vh;padding:22px 22px 110px}.top{display:flex;align-items:center;gap:18px;margin:8px 0 20px}.back{border:0;background:none;color:var(--gold);font-size:38px;padding:0;cursor:pointer}.kicker{font-size:14px;color:#a8bac4}.title{font-family:Impact,"Arial Narrow",sans-serif;font-size:34px;letter-spacing:1px;margin:0}.ready{margin-left:auto;border:1px solid var(--green);color:var(--green);border-radius:10px;padding:13px 16px;font-weight:900;letter-spacing:1px}.game-title{font-family:Impact,"Arial Narrow",sans-serif;font-size:31px;letter-spacing:.5px;margin:0}.meta{color:var(--muted);font-weight:700;letter-spacing:1px;margin:7px 0 18px}.card{border:1px solid var(--line);border-radius:13px;background:rgba(3,12,18,.84);padding:15px;margin:13px 0}.pick-card{border-color:#986f18;box-shadow:inset 0 0 35px rgba(255,187,33,.04)}.pick-row{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center}.team-mark{width:68px;height:68px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-family:Impact,sans-serif;font-size:25px;color:var(--gold)}.pick-name{font-family:Impact,"Arial Narrow",sans-serif;color:var(--white);font-size:31px;letter-spacing:1px}.star{color:var(--gold)}.label{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:1.5px}.prob{font-size:67px;color:var(--cyan);line-height:.95}.confidence{color:var(--gold);font-weight:900;letter-spacing:1px}.bar-labels{display:flex;justify-content:space-between;margin-top:18px;font-weight:900}.bar{height:14px;background:#283d4b;border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--cyan)}h2{font-family:Impact,"Arial Narrow",sans-serif;letter-spacing:1.5px;text-align:center;color:#a5bac7;margin:0 0 13px;font-weight:400}.compare{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;text-align:center;align-items:center}.team{font-family:Impact,"Arial Narrow",sans-serif;font-size:20px}.versus{color:#5e7482}.metrics{margin-top:12px}.metric{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;padding:8px;border-top:1px solid #142a37;text-align:center}.metric b{color:var(--cyan);font-size:24px}.metric span{font-size:12px;color:#9bb0bc;font-weight:900;letter-spacing:1px}.total-grid{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;gap:4px}.total-grid b{display:block;color:var(--cyan);font-family:Impact,sans-serif;font-size:27px;font-weight:400}.total-grid .market{color:#fff}.total-grid span{font-size:10px;color:#839ba9;font-weight:900;letter-spacing:.8px}.reasons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}.reason b{display:block;color:var(--cyan);font-size:23px}.reason span{font-size:11px;font-weight:900;letter-spacing:.8px}.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.check{text-align:center;color:#9db2bd;font-size:10px;font-weight:900;letter-spacing:.7px}.check i{display:block;font-style:normal;color:var(--green);border:1px solid var(--green);border-radius:50%;width:27px;height:27px;line-height:25px;margin:0 auto 6px}.hold{padding:20px;text-align:center;color:#d5e0e5}.hold strong{display:block;color:var(--gold);font-size:22px;margin-bottom:7px}.list{margin-top:20px}.game-row{width:100%;background:#06141d;border:1px solid var(--line);border-radius:12px;color:#fff;text-align:left;padding:15px;margin:7px 0;cursor:pointer}.game-row b{display:block;font-size:17px}.game-row span{color:var(--muted);font-size:13px}.empty{text-align:center;color:var(--muted);padding:40px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,680px);height:82px;background:#04121b;border-top:1px solid #1d4658;display:grid;grid-template-columns:repeat(5,1fr);z-index:9}.bottom a{color:#7892a2;text-decoration:none;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:900;letter-spacing:.8px}.bottom a.active{color:var(--gold)}.bottom b{display:block;font-size:20px}@media(max-width:520px){.app{padding:16px 14px 100px}.title{font-size:28px}.ready{padding:10px;font-size:11px}.game-title{font-size:25px}.pick-row{grid-template-columns:58px 1fr}.team-mark{width:54px;height:54px}.pick-name{font-size:25px}.prob{font-size:55px}.confidence{grid-column:2/4}.total-grid{grid-template-columns:repeat(3,1fr);row-gap:14px}.checks{grid-template-columns:repeat(2,1fr)}}
</style><style>.team-mark{overflow:hidden;background:#06141d}.team-logo{width:82%;height:82%;object-fit:contain;display:block}.compare-team{display:flex;flex-direction:column;align-items:center;gap:7px}.compare-logo{width:58px;height:58px;object-fit:contain}.game-row-inner{display:grid;grid-template-columns:40px 1fr;gap:11px;align-items:center}.row-logo{width:36px;height:36px;object-fit:contain}.row-logo-pair{display:flex;align-items:center}.row-logo-pair img+img{margin-left:-9px}.logo-fallback{display:grid;place-items:center;font-family:Impact,sans-serif;color:var(--gold)}</style></head><body><main class="app"><header class="top"><button class="back" onclick="location.href='index.html'" aria-label="Back">←</button><div><div class="kicker">LAUNCHPOINT HR</div><h1 class="title">GAME BREAKDOWN</h1></div><div class="ready" id="ready">LOADING</div></header><section id="screen"><div class="empty">Loading today’s Game Edge…</div></section><section class="list" id="game-list"></section></main>
<nav class="bottom"><a href="index.html"><b>⌂</b>HOME</a><a href="index.html#games"><b>⌁</b>HR PICKS</a><a class="active" href="game-edge.html"><b>◎</b>GAME EDGE</a><a href="index.html#results"><b>▥</b>RESULTS</a><a href="index.html#more"><b>•••</b>MORE</a></nav>
<script>
const $=s=>document.querySelector(s),num=(v,d=0)=>{const n=Number(v);return Number.isFinite(n)?n:d},esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const teamIds={"Los Angeles Angels":108,"Arizona Diamondbacks":109,"Baltimore Orioles":110,"Boston Red Sox":111,"Chicago Cubs":112,"Cincinnati Reds":113,"Cleveland Guardians":114,"Colorado Rockies":115,"Detroit Tigers":116,"Houston Astros":117,"Kansas City Royals":118,"Los Angeles Dodgers":119,"Washington Nationals":120,"New York Mets":121,"Athletics":133,"Oakland Athletics":133,"Pittsburgh Pirates":134,"San Diego Padres":135,"Seattle Mariners":136,"San Francisco Giants":137,"St. Louis Cardinals":138,"Tampa Bay Rays":139,"Texas Rangers":140,"Toronto Blue Jays":141,"Minnesota Twins":142,"Philadelphia Phillies":143,"Atlanta Braves":144,"Chicago White Sox":145,"Miami Marlins":146,"New York Yankees":147,"Milwaukee Brewers":158};
const logoUrl=team=>teamIds[team]?`https://www.mlbstatic.com/team-logos/${teamIds[team]}.svg`:"";
function logo(team,cls="team-logo"){const src=logoUrl(team);return src?`<img class="${cls}" src="${src}" alt="${esc(team)} logo" onerror="this.outerHTML='<span class=logo-fallback>${esc(initials(team))}</span>'">`:`<span class="logo-fallback">${esc(initials(team))}</span>`}
function addTeamLogos(){
  const mark=document.querySelector('.team-mark');
  if(mark&&!mark.querySelector('img')){
    const label=document.querySelector('.bar-labels span')?.textContent||'';
    const team=Object.keys(teamIds).find(name=>label.startsWith(name));
    if(team)mark.innerHTML=logo(team);
  }
  document.querySelectorAll('.compare .team').forEach(el=>{
    if(el.querySelector('img'))return;
    const team=el.textContent.trim();
    el.classList.add('compare-team');
    el.insertAdjacentHTML('afterbegin',logo(team,'compare-logo'));
  });
  document.querySelectorAll('.game-row').forEach(el=>{
    if(el.querySelector('.row-logo-pair'))return;
    const title=el.querySelector('b')?.textContent||'';
    const teams=title.split(' vs ');
    if(teams.length!==2)return;
    el.innerHTML=`<div class="game-row-inner"><div class="row-logo-pair">${logo(teams[0],'row-logo')}${logo(teams[1],'row-logo')}</div><div>${el.innerHTML}</div></div>`;
  });
}
new MutationObserver(addTeamLogos).observe(document.body,{childList:true,subtree:true});
function csv(text){const rows=[];let row=[],cell="",q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){row.push(cell);cell=""}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(x=>x!==""))rows.push(row);row=[];cell=""}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const h=rows.shift()||[];return rows.map(r=>Object.fromEntries(h.map((x,i)=>[x,r[i]??""])))}
const fmt=v=>num(v).toFixed(1),initials=n=>String(n).split(/\s+/).map(x=>x[0]).join("").slice(0,3).toUpperCase();
function present(v){return v!==undefined&&v!==null&&String(v).trim()!==''}
function valueOrPending(v){return present(v)?fmt(v):'<span class="pending">DATA PENDING</span>'}
function scoreReasons(r,pick){const parts=String(r.winner_reasons||"").split(';').map(x=>x.trim()).filter(Boolean).slice(0,3);if(!parts.length)return '<div class="reason-empty">Reasons will appear after real offense and pitching context is verified.</div>';return parts.map(x=>{const pieces=x.split(':');const team=(pieces.shift()||pick).trim();const label=pieces.join(':').trim()||x;return `<div class="reason"><span>${esc(team)}</span><b>${esc(label.toUpperCase())}</b></div>`}).join('')}
function check(ok,label){return `<div class="check ${ok?'':'bad'}"><i>${ok?'✓':'!'}</i>${label}</div>`}
function render(r){const hold=r.selection_status!=="FINAL READY";const away=num(r.away_win_probability),home=num(r.home_win_probability),pick=r.winner_pick||"No selection",pickHome=pick===r.home_team,win=pickHome?home:away,lose=100-win;const pickInitials=initials(pick);const totalPick=r.total_pick||"NO LINE";const edge=r.total_edge===""?'—':(num(r.total_edge)>0?'+':'')+fmt(r.total_edge);const missing=String(r.missing_inputs||"").split(';');$('#ready').textContent=hold?'DATA HOLD':'FINAL READY ✓';$('#ready').style.borderColor=hold?'#ffbb21':'#7ce63b';$('#ready').style.color=hold?'#ffbb21':'#7ce63b';$('#screen').innerHTML=`<h2 class="game-title">${esc(r.away_team)} vs ${esc(r.home_team)}</h2><div class="meta">${new Date(r.game_datetime_utc).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} · ${esc(r.venue||'Venue pending')}</div>${hold?`<div class="card hold"><strong>DATA HOLD</strong>This matchup stays visible, but no official winning-team or total pick is published until the required model inputs are complete.</div>`:''}<section class="card pick-card"><div class="pick-row"><div class="team-mark">${pickInitials}</div><div><div class="pick-name"><span class="star">★</span> ${hold?'BEST EARLY READ':esc(pick)+' TO WIN'}</div><div class="label">MODEL WIN PROBABILITY</div><div class="prob">${fmt(win)}%</div></div><div class="confidence">◇ ${esc(hold?'HOLD':r.winner_confidence)}</div></div><div class="bar-labels"><span>${esc(pick)} ${fmt(win)}%</span><span>${esc(pickHome?r.away_team:r.home_team)} ${fmt(lose)}%</span></div><div class="bar"><i style="width:${win}%"></i></div></section><section class="card"><h2>TEAM COMPARISON</h2><div class="compare"><div class="team">${esc(r.away_team)}</div><div class="versus">VS</div><div class="team">${esc(r.home_team)}</div></div><div class="metrics"><div class="metric"><b>${fmt(r.away_projected_runs)}</b><span>PROJECTED RUNS</span><b>${fmt(r.home_projected_runs)}</b></div><div class="metric"><b>${fmt(r.away_team_offense_score)}</b><span>OFFENSE SCORE</span><b>${fmt(r.home_team_offense_score)}</b></div><div class="metric"><b>${fmt(r.away_starter_run_prevention)}</b><span>STARTER PREVENTION</span><b>${fmt(r.home_starter_run_prevention)}</b></div><div class="metric"><b>${fmt(r.away_staff_run_prevention)}</b><span>STAFF PREVENTION</span><b>${fmt(r.home_staff_run_prevention)}</b></div></div></section><section class="card"><h2>TOTAL PROJECTION</h2><div class="total-grid"><div><span>PROJECTED TOTAL</span><b>${fmt(r.projected_total)}</b></div><div><span>MARKET TOTAL</span><b class="market">${r.market_total?fmt(r.market_total):'—'}</b></div><div><span>MODEL PICK</span><b>${esc(totalPick)}</b></div><div><span>EDGE</span><b>${edge}</b></div><div><span>STATUS</span><b>${esc(r.total_confidence||'UNAVAILABLE')}</b></div></div></section><section class="card"><h2>WHY ${esc(pick).toUpperCase()}</h2><div class="reasons">${scoreReasons(r,pick)}</div></section><section class="card"><h2>MODEL CHECKS</h2><div class="checks">${check(num(r.data_completeness_pct)>=70,'TEAM DATA '+fmt(r.data_completeness_pct)+'%')}${check(!missing.includes('confirmed_starter'),'STARTERS CONFIRMED')}${check(r.temperature!==''&&num(r.temperature)>0,'WEATHER LIVE')}${check(!missing.includes('confirmed_lineups'),'LINEUPS CONFIRMED')}</div></section>`;}
function renderSafe(r){
  const status=String(r.selection_status||'DATA HOLD').toUpperCase();
  const finalReady=status==='FINAL READY', preliminary=status==='PRELIMINARY';
  const missing=String(r.missing_inputs||'').split(';').filter(Boolean);
  const teamContext=!missing.includes('team_or_pitcher_run_context');
  const hasProjection=teamContext&&present(r.away_win_probability)&&present(r.home_win_probability)&&present(r.winner_pick);
  const pick=hasProjection?r.winner_pick:'';
  const pickHome=pick===r.home_team;
  const win=hasProjection?num(pickHome?r.home_win_probability:r.away_win_probability):0;
  const lose=hasProjection?100-win:0;
  const starters=!missing.includes('confirmed_starter');
  const lineups=!missing.includes('confirmed_lineups');
  const weather=!missing.includes('live_weather')&&present(r.temperature);
  const totalReady=present(r.projected_total);
  const marketReady=present(r.market_total);
  const statusLabel=finalReady?'FINAL READY ✓':preliminary?'PRELIMINARY':'DATA HOLD';
  $('#ready').textContent=statusLabel;
  $('#ready').style.borderColor=finalReady?'#7ce63b':'#ffbb21';
  $('#ready').style.color=finalReady?'#7ce63b':'#ffbb21';
  const pickTitle=finalReady?`${esc(pick)} TO WIN`:preliminary&&hasProjection?'EARLY PROJECTION — NOT OFFICIAL':'OFFICIAL PICK PENDING';
  const probability=hasProjection?`${fmt(win)}%`:'DATA PENDING';
  const totalPick=marketReady?(r.total_pick||'NO EDGE'):'NO LINE';
  const totalEdge=marketReady&&present(r.total_edge)?`${num(r.total_edge)>0?'+':''}${fmt(r.total_edge)}`:'—';
  $('#screen').innerHTML=`
    <h2 class="game-title">${esc(r.away_team)} vs ${esc(r.home_team)}</h2>
    <div class="meta">${new Date(r.game_datetime_utc).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})} · ${esc(r.venue||'Venue pending')}</div>
    ${!finalReady?`<div class="card hold"><strong>${statusLabel}</strong>${preliminary?'Real team and pitching data are loaded, but the official pick is waiting for final lineup or weather confirmation.':'No official winner or total pick is published while required data is missing.'}<div class="hold-note">Missing: ${esc(missing.map(x=>x.replaceAll('_',' ')).join(' · ')||'verification pending')}</div></div>`:''}
    <section class="card pick-card">
      <div class="pick-row"><div class="team-mark">${hasProjection?logo(pick):'—'}</div><div><div class="pick-name"><span class="star">★</span> ${pickTitle}</div><div class="label">MODEL WIN PROBABILITY</div><div class="prob ${hasProjection?'':'pending'}">${probability}</div></div><div class="confidence">◇ ${finalReady?esc(r.winner_confidence):statusLabel}</div></div>
      ${hasProjection?`<div class="bar-labels"><span>${esc(pick)} ${fmt(win)}%</span><span>${esc(pickHome?r.away_team:r.home_team)} ${fmt(lose)}%</span></div><div class="bar"><i style="width:${win}%"></i></div>`:'<div class="hold-note">Win probability will appear after real team and pitcher context loads.</div>'}
    </section>
    <section class="card"><h2>TEAM COMPARISON</h2><div class="compare"><div class="team">${esc(r.away_team)}</div><div class="versus">VS</div><div class="team">${esc(r.home_team)}</div></div>
      <div class="starter-row"><div>STARTER<strong>${esc(r.away_starter||'Pending')}</strong></div><div>VS</div><div>STARTER<strong>${esc(r.home_starter||'Pending')}</strong></div></div>
      <div class="metrics"><div class="metric"><b>${teamContext?valueOrPending(r.away_projected_runs):'<span class="pending">DATA PENDING</span>'}</b><span>PROJECTED RUNS</span><b>${teamContext?valueOrPending(r.home_projected_runs):'<span class="pending">DATA PENDING</span>'}</b></div><div class="metric"><b>${teamContext?valueOrPending(r.away_team_offense_score):'<span class="pending">DATA PENDING</span>'}</b><span>OFFENSE SCORE</span><b>${teamContext?valueOrPending(r.home_team_offense_score):'<span class="pending">DATA PENDING</span>'}</b></div><div class="metric"><b>${teamContext?valueOrPending(r.away_starter_run_prevention):'<span class="pending">DATA PENDING</span>'}</b><span>STARTER PREVENTION</span><b>${teamContext?valueOrPending(r.home_starter_run_prevention):'<span class="pending">DATA PENDING</span>'}</b></div><div class="metric"><b>${teamContext?valueOrPending(r.away_staff_run_prevention):'<span class="pending">DATA PENDING</span>'}</b><span>STAFF PREVENTION</span><b>${teamContext?valueOrPending(r.home_staff_run_prevention):'<span class="pending">DATA PENDING</span>'}</b></div></div>
    </section>
    <section class="card"><h2>TOTAL PROJECTION</h2><div class="total-grid"><div><span>PROJECTED TOTAL</span><b>${teamContext&&totalReady?fmt(r.projected_total):'<span class="pending">PENDING</span>'}</b></div><div><span>MARKET TOTAL</span><b class="market">${marketReady?fmt(r.market_total):'—'}</b></div><div><span>MODEL PICK</span><b>${esc(teamContext?totalPick:'DATA HOLD')}</b></div><div><span>EDGE</span><b>${teamContext?totalEdge:'—'}</b></div><div><span>STATUS</span><b>${esc(teamContext&&marketReady?(r.total_confidence||'UNAVAILABLE'):'UNAVAILABLE')}</b></div>${!marketReady?'<div class="market-note">OVER/UNDER remains unavailable until a real market total is supplied.</div>':''}</div></section>
    <section class="card"><h2>${hasProjection?'WHY '+esc(pick).toUpperCase():'WHY THE MODEL IS WAITING'}</h2><div class="reasons">${scoreReasons(r,pick)}</div></section>
    <section class="card"><h2>MODEL CHECKS</h2><div class="checks">${check(teamContext,'TEAM DATA '+fmt(r.data_completeness_pct)+'%')}${check(starters,'STARTERS CONFIRMED')}${check(weather,'WEATHER LIVE')}${check(lineups,'LINEUPS CONFIRMED')}</div></section>`;
}
let games=[];async function load(){for(const url of ['data/daily_game_predictions.csv','daily_game_predictions.csv']){try{const res=await fetch(url+'?ts='+Date.now());if(!res.ok)continue;games=csv(await res.text());if(games.length)break}catch(e){}}if(!games.length){$('#ready').textContent='NOT READY';$('#screen').innerHTML='<div class="empty">Today’s Game Edge file has not been published yet.</div>';return}renderSafe(games[0]);$('#game-list').innerHTML='<h2>OTHER MATCHUPS</h2>'+games.map((g,i)=>`<button class="game-row" data-i="${i}"><b>${esc(g.away_team)} vs ${esc(g.home_team)}</b><span>${esc(g.selection_status)} · ${esc(g.venue)}</span></button>`).join('');document.querySelectorAll('.game-row').forEach(b=>b.onclick=()=>{renderSafe(games[+b.dataset.i]);scrollTo({top:0,behavior:'smooth'})})}load();
</script>
<script>
// Keep Game Edge current while the page remains open.
setInterval(() => {
  if (!document.hidden) load();
}, 300000);
</script>
</body></html>
