<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LaunchPoint HR Content</title><style>
*{box-sizing:border-box}body{margin:0;background:#061b2b;font-family:Arial,sans-serif;color:#071725}.top{padding:18px 22px;color:white}.logo{font-size:30px;font-weight:1000;font-style:italic}.logo span{color:#18c5ed}.sub{letter-spacing:4px;font-size:11px;color:#c3d7e2}.wrap{max-width:900px;margin:auto;padding:10px 14px 30px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:9px}.tabs button{border:1px solid #356176;background:#09283c;color:#fff;border-radius:18px;padding:8px 11px;white-space:nowrap;font-weight:800}.tabs .on{background:#18c5ed;color:#052033}.card{width:100%;aspect-ratio:4/3;background:#eef8fb;border-radius:18px;overflow:hidden;display:grid;grid-template-rows:34% 12% 17% 29% 8%;box-shadow:0 12px 35px #0007}.hero{position:relative;background:linear-gradient(#d8f2ff 0 50%,#8eaf9c 50% 70%,#557c58 70%);text-align:center;padding:8px 12px}.date{font-size:10px;font-weight:900}.title{font-size:20px;font-weight:1000;margin-top:2px}.match{height:65%;display:grid;grid-template-columns:1fr 44px 1fr;align-items:center}.team{font-size:18px;font-weight:1000}.abbr{font-size:36px;color:#c4152d;font-weight:1000}.vs{font-size:22px;font-weight:1000}.venue{display:inline-block;background:#071c2ddb;color:#fff;border-radius:8px;padding:4px 12px;font-size:10px;font-weight:900}.weather{display:grid;grid-template-columns:repeat(4,1fr);background:#fff}.weather>div{display:flex;align-items:center;justify-content:center;flex-direction:column;border-right:1px solid #cbdde5;font-size:8px;font-weight:900}.weather b{font-size:14px;margin-bottom:2px}.pitchers{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:6px 9px}.pitcher{background:#fff;border:1px solid #c7dbe4;border-radius:9px;padding:7px;display:flex;align-items:center;gap:7px;overflow:hidden}.pitcher img,.pic{width:40px;height:40px;object-fit:cover;border-radius:7px;background:#d7e6ec}.pteam{font-size:7px;font-weight:900}.pname{font-size:12px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pstat{font-size:8px;color:#526672;margin-top:2px}.picks{padding:4px 9px}.picktitle{text-align:center;font-size:14px;font-weight:1000}.pick{height:calc((100% - 20px)/3);margin:2px 0;border-radius:7px;background:#e1eef3;display:grid;grid-template-columns:24px 34px 1fr 38px;gap:5px;align-items:center;padding:2px 6px}.rank{background:#071d30;color:#fff;border-radius:5px;text-align:center;font-size:10px;font-weight:1000;padding:4px 0}.pname2{font-size:11px;font-weight:1000}.meta{font-size:7px;color:#4c626d}.tag{display:inline-block;border-radius:5px;background:#ffd23d;padding:2px 4px;font-size:7px;font-weight:1000}.tag.s{background:#56a9ff}.tag.v{background:#19a96b;color:#fff}.score{font-size:16px;font-weight:1000;color:#bd1530;text-align:right}.bottom{display:grid;grid-template-columns:1.5fr .5fr;align-items:center;padding:4px 10px;background:#e7f3f6}.bottom b{font-size:9px}.why{font-size:7px;margin-top:1px}.slogan{text-align:center;font-size:11px;font-weight:1000;font-style:italic}.slogan span{color:#d89b00}.share{width:100%;margin-top:10px;border:0;border-radius:12px;background:#19c2e9;padding:12px;font-weight:1000;color:#052033}.error{padding:30px;text-align:center;font-weight:900}@media(max-width:560px){.top{padding:13px 15px}.logo{font-size:24px}.sub{font-size:8px;letter-spacing:3px}.wrap{padding:7px}.card{border-radius:12px}.title{font-size:14px}.team{font-size:12px}.abbr{font-size:26px}.weather b{font-size:11px}.pname{font-size:9px}.pitcher img,.pic{width:31px;height:31px}.pname2{font-size:9px}.score{font-size:13px}}
</style></head><body><header class="top"><div class="logo">🚀 LAUNCHPOINT <span>HR</span></div><div class="sub">MLB HOME RUN MATCHUP CONTENT</div></header><main class="wrap"><div id="tabs" class="tabs"></div><div id="card" class="card"><div class="error">Loading LaunchPoint data…</div></div><button class="share" id="share">SHARE GAME CONTENT</button></main><script>
(function(){
var DATA=null,GAMES=[],ACTIVE=0;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function photo(id){return id?'https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_auto:best/v1/people/'+id+'/headshot/67/current':''}
function num(v){var n=Number(v);return isFinite(n)?n:null}
function initials(s){return String(s||'MLB').split(/\s+/).map(function(x){return x.charAt(0)}).join('').slice(0,3).toUpperCase()}
function group(raw){var out={},arr=raw.players||[];arr.forEach(function(p){var key=String(p.game_pk||((p.team||'')+'|'+(p.opponent||'')));if(!out[key])out[key]={game_pk:p.game_pk,players:[]};out[key].players.push(p)});return Object.keys(out).map(function(k){return out[k]})}
function sides(g){var a=g.players[0]||{},t=a.team||'MLB Team',o=a.opponent||'Opponent';var teams={};g.players.forEach(function(p){if(p.team)teams[p.team]=1;if(p.opponent)teams[p.opponent]=1});var names=Object.keys(teams);if(names.length>=2){t=names[0];o=names[1]}return [t,o]}
function pitcherFor(g,team){var opp=g.players.find(function(p){return p.team===team});return opp?{name:opp.pitcher||'',hand:opp.pitcher_hand||'',era:opp.pitcher_era}:{} }
function tag(i){return i===0?['PRIMARY LAUNCH','']:i===1?['SECONDARY','s']:['VALUE','v']}
function render(i){ACTIVE=i;var g=GAMES[i],ss=sides(g),away=ss[0],home=ss[1],p=g.players.slice().sort(function(a,b){return (b.raw_hr_edge||0)-(a.raw_hr_edge||0)}).slice(0,3),base=p[0]||{},ap=pitcherFor(g,home),hp=pitcherFor(g,away);document.querySelectorAll('#tabs button').forEach(function(b,j){b.className=j===i?'on':''});
function pit(x,tm){return '<div class="pitcher">'+(x.name?'<div><div class="pteam">'+esc(tm)+' STARTER</div><div class="pname">'+esc(x.name)+'</div><div class="pstat">'+esc(x.hand?x.hand+'HP':'')+(x.era!=null?' · '+esc(x.era)+' ERA':'')+'</div></div>':'<div><div class="pteam">'+esc(tm)+' STARTER</div><div class="pname">Starter not verified</div></div>')+'</div>'}
var rows=p.map(function(x,j){var tg=tag(j),order=num(x.batting_order);return '<div class="pick"><div class="rank">'+(j+1)+'</div><img class="pic" src="'+photo(x.player_id)+'" onerror="this.style.visibility=\'hidden\'"><div><div class="pname2">'+esc(x.player||'Hitter')+'</div><div class="meta"><span class="tag '+tg[1]+'">'+tg[0]+'</span> '+esc(x.hitter_hand||'')+(order&&order>0?' | #'+order:'')+'</div></div><div class="score">'+Math.round(x.raw_hr_edge||0)+'</div></div>'}).join('');
var reasons=[];p.forEach(function(x){String(x.red_flag_reasons||'').split('|').forEach(function(r){if(r&&reasons.indexOf(r)<0)reasons.push(r)})});reasons=reasons.slice(0,3);
var temp=base.temperature!=null?Math.round(base.temperature)+'°F':'—',wind=base.wind_speed!=null?Math.round(base.wind_speed)+' MPH '+esc(base.wind_direction||''):'—',rain=base.rain_probability!=null?Math.round(base.rain_probability)+'%':'—',park=base.park_lean||'—';
document.getElementById('card').innerHTML='<div class="hero"><div class="date">'+esc(base.game_date||DATA.slate_date||'')+'</div><div class="title">MLB MATCHUP PREVIEW</div><div class="match"><div><div class="abbr">'+initials(away)+'</div><div class="team">'+esc(away)+'</div></div><div class="vs">VS</div><div><div class="abbr">'+initials(home)+'</div><div class="team">'+esc(home)+'</div></div></div><div class="venue">'+esc(base.venue||'BALLPARK')+'</div></div><div class="weather"><div><b>☀ '+temp+'</b>TEMP</div><div><b>💨 '+wind+'</b>WIND</div><div><b>💧 '+rain+'</b>RAIN</div><div><b>'+esc(park)+'</b>BALLPARK</div></div><div class="pitchers">'+pit(ap,away)+pit(hp,home)+'</div><div class="picks"><div class="picktitle">TOP HOME RUN PICKS</div>'+rows+'</div><div class="bottom"><div><b>KEY TAKEAWAYS</b>'+(reasons.length?reasons.map(function(r){return '<div class="why">• '+esc(r.replace(/_/g,' '))+'</div>'}).join(''):'<div class="why">• LaunchPoint model matchup signals</div>')+'</div><div class="slogan">GOOD VIBES<br><span>MORE HOMERS 👑</span></div></div>'}
function setup(){var tabs=document.getElementById('tabs');tabs.innerHTML='';GAMES.forEach(function(g,i){var ss=sides(g),b=document.createElement('button');b.textContent=ss[0]+' vs '+ss[1];b.onclick=function(){render(i)};tabs.appendChild(b)});var q=new URLSearchParams(location.search),pk=q.get('game_pk'),idx=0;if(pk){var f=GAMES.findIndex(function(g){return String(g.game_pk)===String(pk)});if(f>=0)idx=f}render(idx)}
fetch('./data/todays_top_hr_picks.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(d){DATA=d;GAMES=group(d);if(!GAMES.length)throw new Error('No games');setup()}).catch(function(e){document.getElementById('card').innerHTML='<div class="error">CONTENT DATA COULD NOT LOAD<br><small>'+esc(e.message)+'</small></div>'});
document.getElementById('share').onclick=function(){var g=GAMES[ACTIVE];if(!g)return;var ss=sides(g),text='LaunchPoint HR — '+ss[0]+' vs '+ss[1];if(navigator.share){navigator.share({title:'LaunchPoint HR',text:text,url:location.href}).catch(function(){})}else if(navigator.clipboard){navigator.clipboard.writeText(location.href)}};
})();
</script></body></html>
