<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LaunchPoint HR Content</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef5f9;color:#071b2d;font-family:Arial,Helvetica,sans-serif}.top{background:#062238;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}.brand{font-size:27px;font-weight:1000;font-style:italic}.brand b{color:#14bde8}.brand em{color:#ffc73b;font-style:normal}.sub{font-size:11px;letter-spacing:2px;color:#b9d5e4}.wrap{max-width:760px;margin:auto;padding:16px}.select{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.select button{white-space:nowrap;border:1px solid #a9c8d8;background:white;border-radius:18px;padding:10px 14px;font-weight:800}.select button.on{background:#12bde8;color:#032136;border-color:#12bde8}.card{background:white;border:1px solid #b8d4e1;border-radius:24px;overflow:hidden;box-shadow:0 10px 30px #15384b22}.hero{background:linear-gradient(#dff4ff,#fff);padding:22px;text-align:center}.date{font-size:12px;font-weight:900;letter-spacing:1.5px}.match{display:grid;grid-template-columns:1fr 55px 1fr;align-items:center;margin:18px 0}.team{font-size:24px;font-weight:1000}.vs{font-size:24px;font-weight:1000;color:#567}.venue{font-weight:900}.weather{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #d9e8ef;border-bottom:1px solid #d9e8ef}.weather div{padding:14px 5px;text-align:center;border-right:1px solid #d9e8ef}.weather div:last-child{border:0}.weather b{display:block;font-size:20px}.section{padding:17px}.title{font-weight:1000;font-size:18px;margin-bottom:10px}.pitchers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pitcher,.pick,.take{border:1px solid #d3e4ec;border-radius:14px;padding:12px}.pitcher b,.pick b{display:block;font-size:17px}.picks{display:grid;gap:8px}.pick{display:grid;grid-template-columns:1fr auto;align-items:center}.tag{display:inline-block;font-size:10px;font-weight:1000;padding:5px 8px;border-radius:10px;background:#ffd33d;margin-bottom:4px}.secondary{background:#a94ce6;color:white}.value{background:#16a368;color:white}.edge{font-size:25px;font-weight:1000;color:#b20d25}.stats{font-size:12px;color:#536a78;margin-top:5px}.takeaways{background:#f3f9fc}.take{margin-top:7px;background:white}.empty{color:#789;font-style:italic}.foot{text-align:center;background:#062238;color:white;padding:17px;font-weight:900}.share{width:100%;margin:15px 0 30px;border:0;border-radius:14px;background:#10bde7;padding:14px;font-weight:1000;color:#062238;font-size:16px}@media(max-width:520px){.team{font-size:19px}.weather{grid-template-columns:1fr 1fr}.weather div:nth-child(2){border-right:0}.pitchers{grid-template-columns:1fr}.wrap{padding:10px}}
</style></head><body><header class="top"><div class="brand">🚀 LAUNCHPOINT <b>HR</b></div><div class="sub">MLB HOME RUN GAME CONTENT</div></header><main class="wrap"><div id="tabs" class="select"></div><div id="card" class="card"><div class="hero">Loading LaunchPoint game data…</div></div><button class="share" onclick="shareCard()">SHARE GAME CONTENT</button></main>
<script>
let DATA=null,GAMES=[],active=0;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=(v)=>{v=Number(v);return Number.isFinite(v)?v:null};
function first(o,keys){for(const k of keys){if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k]}return null}
function normalize(raw){if(Array.isArray(raw.games)&&raw.games.length)return raw.games;if(Array.isArray(raw))return raw;const players=raw.players||raw.picks||raw.data||[];const map={};for(const p of players){const away=first(p,['away_team','away']),home=first(p,['home_team','home']),opp=first(p,['opponent']);const team=first(p,['team','team_name']);const key=first(p,['game_pk','game_id'])||[away||team,home||opp].join('|');if(!map[key])map[key]={game_pk:first(p,['game_pk','game_id']),away_team:away||team,home_team:home||opp,players:[]};map[key].players.push(p)}return Object.values(map)}
function players(g){return g.players||g.picks||g.hitters||g.hr_picks||[]}
function teamName(g,side){return first(g,[side+'_team',side,'team_'+side])||'MLB Team'}
function pitcher(g,side){const p=first(g,[side+'_starter',side+'_pitcher','starting_pitcher_'+side]);if(p&&typeof p==='object')return p;const name=first(g,[side+'_starter_name',side+'_pitcher_name']);return {name:name||'Starter TBD',hand:first(g,[side+'_starter_hand',side+'_pitcher_hand'])}}
function pickLabel(i,p){const raw=String(first(p,['pick_status','label','role','daily_tier'])||'').toUpperCase();if(raw.includes('PRIMARY')||i===0)return ['PRIMARY LAUNCH',''];if(raw.includes('SECOND')||i===1)return ['SECONDARY','secondary'];return [raw&&raw!=='NO PLAY'?raw:'VALUE PICK','value']}
function render(i){active=i;document.querySelectorAll('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));const g=GAMES[i]||{};const away=teamName(g,'away'),home=teamName(g,'home');const venue=first(g,['venue','park','stadium','ballpark'])||'';const temp=first(g,['temperature','temp']);const wind=first(g,['wind_display','wind','wind_direction']);const rain=first(g,['rain_probability','rain']);const park=first(g,['park_label','park_type','park_friendly']);const ap=pitcher(g,'away'),hp=pitcher(g,'home');let ps=players(g).filter(p=>String(first(p,['pick_status','selection_status','status'])||'').toUpperCase()!=='NO PLAY');ps.sort((a,b)=>(num(first(b,['raw_hr_edge','hr_edge','score','launch_rating']))||0)-(num(first(a,['raw_hr_edge','hr_edge','score','launch_rating']))||0));ps=ps.slice(0,3);
const metric=(p,k,label,fmt=x=>x)=>{const v=num(first(p,k));return v===null?'':`${label} ${fmt(v)}`};
const pickHtml=ps.length?ps.map((p,j)=>{const [lab,cl]=pickLabel(j,p),edge=num(first(p,['raw_hr_edge','hr_edge','score','launch_rating']));const stats=[metric(p,['slg','SLG'],'SLG',v=>v.toFixed(3).replace(/^0/,'')),metric(p,['iso','ISO'],'ISO',v=>v.toFixed(3).replace(/^0/,'')),metric(p,['barrel_rate','barrel_pct','BARREL%'],'BARREL',v=>v.toFixed(1)+'%'),metric(p,['avg_exit_velocity','ev','EV'],'EV',v=>v.toFixed(1))].filter(Boolean).join(' · ');return `<div class="pick"><div><span class="tag ${cl}">${esc(lab)}</span><b>${esc(first(p,['player_name','name','player'])||'Hitter')}</b><div class="stats">${esc(stats)}</div></div>${edge===null?'':`<div class="edge">${Math.round(edge)}</div>`}</div>`}).join(''):'<div class="empty">No verified HR picks available for this game.</div>';
const reasons=[];for(const p of ps){const r=first(p,['reasons','reason','why','matchup_reason']);if(Array.isArray(r))reasons.push(...r);else if(r)reasons.push(r)}
const reasonHtml=[...new Set(reasons)].slice(0,4).map(r=>`<div class="take">✓ ${esc(r)}</div>`).join('')||'<div class="empty">Only verified model insights will appear here.</div>';
document.getElementById('card').innerHTML=`<div class="hero"><div class="date">${esc(first(g,['game_date','date','slate_date'])||DATA?.slate_date||'TODAY')} ${esc(first(g,['game_time','time'])||'')}</div><div class="match"><div class="team">${esc(away)}</div><div class="vs">VS</div><div class="team">${esc(home)}</div></div><div class="venue">${esc(venue)}</div></div><div class="weather"><div><b>${temp==null?'—':esc(temp)+'°F'}</b>TEMP</div><div><b>${wind?esc(wind):'—'}</b>WIND</div><div><b>${rain==null?'—':esc(rain)+'%'}</b>RAIN</div><div><b>${park?esc(park):'—'}</b>PARK</div></div><section class="section"><div class="title">STARTING PITCHERS</div><div class="pitchers"><div class="pitcher"><small>${esc(away)} STARTER</small><b>${esc(first(ap,['name','player_name'])||'Starter TBD')}</b>${esc(first(ap,['hand','throws'])||'')}</div><div class="pitcher"><small>${esc(home)} STARTER</small><b>${esc(first(hp,['name','player_name'])||'Starter TBD')}</b>${esc(first(hp,['hand','throws'])||'')}</div></div></section><section class="section"><div class="title">TOP HOME RUN PICKS</div><div class="picks">${pickHtml}</div></section><section class="section takeaways"><div class="title">KEY TAKEAWAYS</div>${reasonHtml}</section><div class="foot">LAUNCHPOINT HR · DATA DRIVEN. BIGGER OPPORTUNITIES.</div>`}
function setup(){const tabs=document.getElementById('tabs');tabs.innerHTML=GAMES.map((g,i)=>`<button onclick="render(${i})">${esc(teamName(g,'away'))} vs ${esc(teamName(g,'home'))}</button>`).join('');render(0)}
async function shareCard(){const g=GAMES[active]||{};const text=`LaunchPoint HR — ${teamName(g,'away')} vs ${teamName(g,'home')}`;if(navigator.share){try{await navigator.share({title:'LaunchPoint HR',text,url:location.href});return}catch(e){}}navigator.clipboard?.writeText(location.href);alert('Game content link copied.');}
fetch('data/todays_top_hr_picks.json?ts='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;GAMES=normalize(d);if(!GAMES.length)throw Error('No games');setup()}).catch(e=>{document.getElementById('card').innerHTML='<div class="hero"><b>CONTENT NOT AVAILABLE YET</b><br><small>The card will populate when today’s LaunchPoint HR feed contains games.</small></div>'});
</script></body></html>
