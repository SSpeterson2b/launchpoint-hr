(function(){var DATA=null,GAMES=[],ACTIVE=0;var teamIds={'Arizona Diamondbacks':109,'Atlanta Braves':144,'Baltimore Orioles':110,'Boston Red Sox':111,'Chicago Cubs':112,'Chicago White Sox':145,'Cincinnati Reds':113,'Cleveland Guardians':114,'Colorado Rockies':115,'Detroit Tigers':116,'Houston Astros':117,'Kansas City Royals':118,'Los Angeles Angels':108,'Los Angeles Dodgers':119,'Miami Marlins':146,'Milwaukee Brewers':158,'Minnesota Twins':142,'New York Mets':121,'New York Yankees':147,'Athletics':133,'Philadelphia Phillies':143,'Pittsburgh Pirates':134,'San Diego Padres':135,'San Francisco Giants':137,'Seattle Mariners':136,'St. Louis Cardinals':138,'Tampa Bay Rays':139,'Texas Rangers':140,'Toronto Blue Jays':141,'Washington Nationals':120};function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function logo(t){var id=teamIds[t];return id?'https://www.mlbstatic.com/team-logos/'+id+'.svg':''}function photo(id){return id?'https://img.mlbstatic.com/mlb-photos/image/upload/w_180,q_auto:best/v1/people/'+id+'/headshot/67/current':''}function num(v){var n=Number(v);return isFinite(n)?n:null}function displayName(n){var s=String(n||'');if(s.indexOf(',')>-1){var a=s.split(',');return(a[1]||'').trim()+' '+(a[0]||'').trim()}return s}function group(raw){var out={};(raw.players||[]).forEach(function(p){var key=String(p.game_pk||((p.team||'')+'|'+(p.opponent||'')));if(!out[key])out[key]={game_pk:p.game_pk,players:[]};out[key].players.push(p)});return Object.keys(out).map(function(k){return out[k]})}function sides(g){var a=g.players[0]||{},teams={};g.players.forEach(function(p){if(p.team)teams[p.team]=1;if(p.opponent)teams[p.opponent]=1});var names=Object.keys(teams);return names.length>=2?[names[0],names[1]]:[a.team||'MLB Team',a.opponent||'Opponent']}function shortTeam(t){var a={'Philadelphia Phillies':'PHILLIES','Washington Nationals':'NATIONALS','New York Mets':'METS','New York Yankees' HOMERS 👑</span><div class="brandFoot">LAUNCHPOINT HR</div></div></div>'}function setup(){var tabs=document.getElementById('tabs');tabs.innerHTML='';GAMES.forEach(function(g,i){var ss=sides(g),b=document.createElement('button');b.textContent=ss[0]+' vs '+ss[1];b.onclick=function(){render(i)};tabs.appendChild(b)});var q=new URLSearchParams(location.search),pk=q.get('game_pk'),gk=q.get('game_key'),idx=0;if(pk){var f=GAMES.findIndex(function(g){return String(g.game_pk)===String(pk)});if(f>=0)idx=f}else if(gk){var f2=GAMES.findIndex(function(g){var ss=sides(g);return(ss[0]+' vs '+ss[1])===gk||(ss[1]+' vs '+ss[0])===gk});if(f2>=0)idx=f2}render(idx)}fetch('./data/todays_top_hr_picks.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(d){DATA=d;GAMES=group(d);if(!GAMES.length)throw Error('No games');setup()}).catch(function(e){document.getElementById('card').innerHTML='<div class="error">CONTENT DATA COULD NOT LOAD<br><small>'+esc(e.message)+'</small></div>'});document.getElementById('share').onclick=function(){var g=GAMES[ACTIVE];if(!g)return;var ss=sides(g),text='LaunchPoint HR — '+ss[0]+' vs '+ss[1];if(navigator.share)navigator.share({title:'LaunchPoint HR',text:text,url:location.href}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(location.href)}})();
