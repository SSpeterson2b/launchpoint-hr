<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LaunchPoint HR Matchup Content</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071b2b;color:#071725;font-family:Arial,Helvetica,sans-serif}.top{background:#061e31;color:#fff;padding:15px 18px}.brand{font-size:25px;font-weight:1000;font-style:italic}.brand b{color:#18c6ef}.sub{font-size:10px;letter-spacing:2.4px;color:#b9d5e4;margin-top:2px}.wrap{max-width:900px;margin:auto;padding:12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap;border:1px solid #2e637c;background:#09263a;color:#d9edf6;border-radius:16px;padding:8px 12px;font-weight:800}.tabs button.on{background:#16c4ec;color:#041925}.poster{width:100%;aspect-ratio:4/3;background:#edf8fc;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #0008;display:grid;grid-template-rows:43% 12% 16% 21% 8%;position:relative}.hero{position:relative;background:linear-gradient(180deg,#cfeeff,#eefaff);overflow:hidden;text-align:center;padding:9px 14px}.stadium{position:absolute;inset:0;background:linear-gradient(180deg,#c9e9f8aa,#dff3f8cc 45%,#88a99a 46%,#5f8b69 72%,#b7d6d4);opacity:.7}.heroContent{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;justify-content:space-between}.date{font-size:11px;font-weight:900}.preview{font-size:20px;font-weight:1000;letter-spacing:.04em}.match{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center}.team{font-size:21px;font-weight:1000;line-height:1.02}.abbr{font-size:38px;font-weight:1000;color:#c5152f;text-shadow:0 2px 0 #fff}.vs{font-size:23px;font-weight:1000}.venue{display:inline-block;align-self:center;background:#071b2dcc;color:white;border-radius:9px;padding:5px 13px;font-size:12px;font-weight:900}.weather{display:grid;grid-template-columns:repeat(4,1fr);background:#f7fcfe;border-bottom:1px solid #bfd7e2}.weather div{display:flex;flex-direction:column;justify-content:center;align-items:center;border-right:1px solid #d2e3ea;font-size:10px;font-weight:900}.weather div:last-child{border:0}.weather b{font-size:17px;margin-bottom:2px}.pitchers{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:7px 10px;background:#eef8fb}.pitcher{background:white;border:1px solid #c7dce6;border-radius:10px;padding:7px 9px;display:flex;align-items:center;gap:8px;overflow:hidden}.head{width:48px;height:48px;border-radius:7px;background:#d9e8ee;object-fit:cover}.ptext{min-width:0}.pteam{font-size:8px;font-weight:1000;text-transform:uppercase}.pname{font-size:15px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pstats{font-size:9px;font-weight:800;color:#405666;margin-top:2px}.picks{padding:5px 10px;background:#f5fbfd}.picktitle{text-align:center;font-size:15px;font-weight:1000;margin-bottom:4px}.pickrow{height:calc((100% - 22px)/3);min-height:0;background:#e7f2f6;border-radius:8px;margin:3px 0;display:grid;grid-template-columns:26px 34px 1fr auto;align-items:center;gap:7px;padding:3px 7px}.rank{background:#071b2d;color:white;border-radius:6px;text-align:center;padding:4px 0;font-weight:1000;font-size:11px}.avatar{width:32px;height:32px;border-radius:6px;background:#d2e3ea;object-fit:cover}.name{font-size:13px;font-weight:1000;line-height:1}.meta{font-size:8px;color:#415966;margin-top:2px}.tag{display:inline-block;border-radius:6px;padding:2px 5px;font-size:7px;font-weight:1000;background:#ffd33d;margin-right:4px}.secondary{background:#4da8ff}.value{background:#19a969;color:white}.edge{font-size:18px;font-weight:1000;color:#ba1731}.takeaways{display:grid;grid-template-columns:1.4fr .6fr;align-items:center;padding:6px 11px;background:#e9f5f8}.takeaways b{font-size:11px}.reason{font-size:8px;margin-top:2px}.slogan{text-align:center;font-weight:1000;font-style:italic;font-size:15px}.slogan span{color:#e6aa18}.share{width:100%;margin:11px 0;border:0;border-radius:12px;background:#18c6ef;color:#062033;padding:12px;font-weight:1000}.empty{font-size:11px;color:#667b87}@media(max-width:560px){.wrap{padding:7px}.poster{border-radius:12px}.preview{font-size:15px}.team{font-size:14px}.abbr{font-size:28px}.weather b{font-size:13px}.pname{font-size:11px}.head{width:39px;height:39px}.picktitle{font-size:12px}.pickrow{grid-template-columns:22px 28px 1fr auto;gap:5px;padding:2px 5px}.avatar{width:27px;height:27px}.name{font-size:10px}.edge{font-size:14px}.slogan{font-size:11px}}
</style></head><body><header class="top"><div class="brand">🚀 LAUNCHPOINT <b>HR</b></div><div class="sub">MLB HOME RUN MATCHUP CONTENT</div></header><main class="wrap"><div id="tabs" class="tabs"></div><div id="card" class="poster"><div class="hero">Loading LaunchPoint data…</div></div><button class="share" onclick="shareCard()">SHARE GAME CONTENT</button></main>
<script>
let DATA=null,GAMES=[],active=0;const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const N=v=>{v=Number(v);return Number.isFinite(v)?v:null};function F(o,ks){for(const k of ks)if(o&&o[k]!==undefined&&o[k]!==null&&o[k]!=='')return o[k];return null}function abbr(n){return String(n||'MLB').split(/\s+/).map(x=>x[0]).join('').slice(0,3).toUpperCase()}function photo(id){return id?`https://img.mlbstatic.com/mlb-photos/image/upload/w_180,q_auto:best/v1/people/${id}/headshot/67/current`:''}
function normalize(raw){if(Array.isArray(raw.games)&&raw.games.length)return raw.games;const a=raw.players||raw.picks||raw.data||[];const m={};for(const p of a){const away=F(p,['away_team','away']),home=F(p,['home_team','home']),team=F(p,['team','team_name']),opp=F(p,['opponent']);const key=F(p,['game_pk','game_id'])||[away||team,home||opp].join('|');if(!m[key])m[key]={game_pk:F(p,['game_pk','game_id']),away_team:away||team,home_team:home||opp,players:[]};m[key].players.push(p)}return Object.values(m)}
function team(g,s){return F(g,[s+'_team',s,'team_'+s])||'MLB Team'}function plist(g){return g.players||g.picks||g.hitters||g.hr_picks||[]}function pObj(g,s){let p=F(g,[s+'_starter',s+'_pitcher','starting_pitcher_'+s]);if(p&&typeof p==='object')return p;return {name:F(g,[s+'_starter_name',s+'_pitcher_name']),hand:F(g,[s+'_starter_hand',s+'_pitcher_hand']),player_id:F(g,[s+'_starter_id',s+'_pitcher_id'])}}
function label(i,p){let x=String(F(p,['pick_status','label','role','daily_tier'])||'').toUpperCase();if(x.includes('PRIMARY')||i===0)return['PRIMARY LAUNCH',''];if(x.includes('SECOND')||i===1)return['SECONDARY','secondary'];return['VALUE','value']}
function render(i){active=i;document.querySelectorAll('#tabs button').forEach((b,j)=>b.classList.toggle('on',j===i));const g=GAMES[i]||{},away=team(g,'away'),home=team(g,'home'),all=plist(g);let ps=all.filter(p=>String(F(p,['selection_status','status'])||'').toUpperCase()!=='NO PLAY');ps.sort((a,b)=>(N(F(b,['raw_hr_edge','hr_edge','score','launch_rating']))||0)-(N(F(a,['raw_hr_edge','hr_edge','score','launch_rating']))||0));ps=ps.slice(0,3);const ap=pObj(g,'away'),hp=pObj(g,'home');const temp=F(g,['temperature','temp'])??F(ps[0],['temperature','temp']),wind=F(g,['wind_display','wind','wind_direction'])??F(ps[0],['wind_display','wind','wind_direction']),rain=F(g,['rain_probability','rain'])??F(ps[0],['rain_probability','rain']),park=F(g,['park_label','park_type','park_friendly','park_lean'])??F(ps[0],['park_label','park_type','park_friendly','park_lean']),venue=(F(g,['venue','park','stadium','ballpark'])??F(ps[0],['venue','park','stadium','ballpark']))||'';function pitcher(x,t){let name=F(x,['name','player_name']);if(!name){const opp=all.find(p=>F(p,['opposing_pitcher','pitcher']));name=opp?F(opp,['opposing_pitcher','pitcher']):null}const id=F(x,['player_id','id']);const era=F(x,['era','ERA']),whip=F(x,['whip','WHIP']);return `<div class="pitcher">${id?`<img class="head" src="${photo(id)}" onerror="this.style.visibility='hidden'">`:''}<div class="ptext"><div class="pteam">${E(t)} STARTER</div><div class="pname">${E(name||'Starter not verified')}</div><div class="pstats">${E(F(x,['hand','throws'])||'')}${era!=null?` · ${E(era)} ERA`:''}${whip!=null?` · ${E(whip)} WHIP`:''}</div></div></div>`}const rows=ps.length?ps.map((p,j)=>{const [lab,cl]=label(j,p),score=N(F(p,['raw_hr_edge','hr_edge','score','launch_rating'])),order=N(F(p,['batting_order'])),hand=F(p,['hitter_hand','bats']);return `<div class="pickrow"><div class="rank">${j+1}</div><img class="avatar" src="${photo(F(p,['player_id','id']))}" onerror="this.style.visibility='hidden'"><div><div class="name">${E(F(p,['player_name','player','name'])||'Hitter')}</div><div class="meta"><span class="tag ${cl}">${lab}</span>${hand?E(hand)+'HB ':''}${order?`| #${order}`:''}</div></div><div class="edge">${score==null?'—':Math.round(score)}</div></div>`}).join(''):'<div class="empty">No verified HR selections yet.</div>';let rs=[];for(const p of ps){let r=F(p,['reasons','reason','why','matchup_reason','red_flag_reasons']);if(Array.isArray(r))rs.push(...r);else if(r)rs.push(...String(r).split('|'))}rs=[...new Set(rs)].filter(Boolean).slice(0,4);document.getElementById('card').innerHTML=`<div class="hero"><div class="stadium"></div><div class="heroContent"><div class="date">${E(F(g,['game_date','date','slate_date'])||DATA?.slate_date||'TODAY')} · ${E(F(g,['game_time','time'])||'')}</div><div class="preview">MLB MATCHUP PREVIEW</div><div class="match"><div><div class="abbr">${abbr(away)}</div><div class="team">${E(away)}</div></div><div class="vs">VS</div><div><div class="abbr">${abbr(home)}</div><div class="team">${E(home)}</div></div></div><div class="venue">${E(venue||'BALLPARK')}</div></div></div><div class="weather"><div><b>☀ ${temp==null?'—':E(temp)+'°F'}</b>TEMP</div><div><b>💨 ${wind?E(wind):'—'}</b>WIND</div><div><b>💧 ${rain==null?'—':E(rain)+'%'}</b>RAIN</div><div><b>${park?E(park):'—'}</b>BALLPARK</div></div><div class="pitchers">${pitcher(ap,away)}${pitcher(hp,home)}</div><div class="picks"><div class="picktitle">TOP HOME RUN PICKS</div>${rows}</div><div class="takeaways"><div><b>KEY TAKEAWAYS</b>${rs.length?rs.map(r=>`<div class="reason">• ${E(r.replaceAll('_',' '))}</div>`).join(''):'<div class="reason">• Verified model signals only</div>'}</div><div class="slogan">GOOD VIBES<br><span>MORE HOMERS 👑</span></div></div>`}
function setup(){document.getElementById('tabs').innerHTML=GAMES.map((g,i)=>`<button onclick="render(${i})">${E(team(g,'away'))} vs ${E(team(g,'home'))}</button>`).join('');let q=new URLSearchParams(location.search),pk=q.get('game_pk'),k=pk?GAMES.findIndex(g=>String(g.game_pk)===String(pk)):-1;render(k>=0?k:0)}async function shareCard(){const g=GAMES[active]||{},text=`LaunchPoint HR — ${team(g,'away')} vs ${team(g,'home')}`;if(navigator.share){try{await navigator.share({title:'LaunchPoint HR',text,url:location.href});return}catch(e){}}await navigator.clipboard?.writeText(location.href);alert('Game content link copied.')}fetch('data/todays_top_hr_picks.json?ts='+Date.now()).then(r=>r.json()).then(d=>{DATA=d;GAMES=normalize(d);if(!GAMES.length)throw Error();setup()}).catch(()=>document.getElementById('card').innerHTML='<div class="hero"><b>CONTENT NOT AVAILABLE YET</b></div>');
</script></body></html>
