(function(){var DATA=null,GAMES=[],ACTIVE=0;var teamIds={'Arizona Diamondbacks':109,'Atlanta Braves':144,'Baltimore Orioles':110,'Boston Red Sox':111,'Chicago Cubs':112,'Chicago White Sox':145,'Cincinnati Reds':113,'Cleveland Guardians':114,'Colorado Rockies':115,'Detroit Tigers':116,'Houston Astros':117,'Kansas City Royals':118,'Los Angeles Angels':108,'Los Angeles Dodgers':119,'Miami Marlins':146,'Milwaukee Brewers':158,'Minnesota Twins':142,'New York Mets':121,'New York Yankees':147,'Athletics':133,'Philadelphia Phillies':143,'Pittsburgh Pirates':134,'San Diego Padres':135,'San Francisco Giants':137,'Seattle Mariners':136,'St. Louis Cardinals':138,'Tampa Bay Rays':139,'Texas Rangers':140,'Toronto Blue Jays':141,'Washington Nationals':120};function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function logo(t){var id=teamIds[t];return id?'https://www.mlbstatic.com/team-logos/'+id+'.svg':''}function photo(id){return id?'https://img.mlbstatic.com/mlb-photos/image/upload/w_120,q_auto:best/v1/people/'+id+'/headshot/67/current':''}function num(v){var n=Number(v);return isFinite(n)?n:null}function group(raw){var out={},arr=raw.players||[];arr.forEach(function(p){var key=String(p.game_pk||((p.team||'')+'|'+(p.opponent||'')));if(!out[key])out[key]={game_pk:p.game_pk,players:[]};out[key].players.push(p)});return Object.keys(out).map(function(k){return out[k]})}function sides(g){var a=g.players[0]||{},t=a.team||'MLB Team',o=a.opponent||'Opponent',teams={};g.players.forEach(function(p){if(p.team)teams[p.team]=1;if(p.opponent)teams[p.opponent]=1});var names=Object.keys(teams);if(names.length>=2){t=names[0];o=names[1]}return[t,o]}function pitcherFor(g,team){var x=g.players.find(function(p){return p.team===team});return x?{name:x.pitcher||'',hand:x.pitcher_hand||'',era:x.pitcher_era,whip:x.pitcher_whip,id:x.pitcher_id}:{} }function tag(x,i){var v=String(x.pick_status||x.daily_tier||x.raw_classification||'').toUpperCase();if(v.indexOf('PRIMARY')>=0||v==='ELITE')return['PRIMARY LAUNCH',''];if(v.indexOf('SECONDARY')>=0||v==='STRONG')return['SECONDARY','s'];if(v.indexOf('VALUE')>=0)return['VALUE','v'];return i===0?['PRIMARY LAUNCH','']:i===1?['SECONDARY','s']:['VALUE','v']}function render(i){ACTIVE=i;var g=GAMES[i],ss=sides(g),away=ss[0],home=ss[1],p=g.players.slice().sort(function(a,b){return(b.raw_hr_edge||0)-(a.raw_hr_edge||0)}).slice(0,3),base=p[0]||{},ap=pitcherFor(g,away),hp=pitcherFor(g,home);document.querySelectorAll('#tabs button').forEach(function(b,j){b.className=j===i?'on':''});function pit(x,tm){return'<div class="pitcher">'+(x.id?'<img src="'+photo(x.id)+'" onerror="this.style.visibility=\'hidden\'">':'<div></div>')+'<div><div class="pteam">'+esc(tm)+' STARTER</div><div class="pname">'+esc(x.name||'Starter not verified')+'</div><div class="pstat">'+esc(x.hand?x.hand+'HP':'')+(x.era!=null?' · '+esc(x.era)+' ERA':'')+(x.whip!=null?' | '+esc(x.whip)+' WHIP':'')+'</div></div></div>'}var rows=p.map(function(x,j){var tg=tag(x,j),order=num(x.batting_order),tl=logo(x.team);return'<div class="pick"><div class="rank">'+(j+1)+'</div>'+(tl?'<img class="teamMini" src="'+tl+'">':'<div></div>')+'<img class="pic" src="'+photo(x.player_id)+'" onerror="this.style.visibility=\'hidden\'"><div><div class="pname2">'+esc(x.player||'Hitter')+'</div><div class="meta"><span class="tag '+tg[1]+'">'+tg[0]+'</span>'+esc(x.position||'')+(order&&order>0?' | #'+order:'')+'</div></div><div class="score">'+Math.round(x.raw_hr_edge||0)+'</div><div class="bars">▥</div></div>'}).join('');var reasons=[];p.forEach(function(x){String(x.red_flag_reasons||'').split('|').forEach(function(r){if(r&&reasons.indexOf(r)<0)reasons.push(r)})});reasons=reasons.slice(0,4);var temp=base.temperature!=null?Math.round(base.temperature)+'°F':'—',wind=base.wind_speed!=null?Math.round(base.wind_speed)+' MPH '+esc(base.wind_direction||''):'—',rain=base.rain_probability!=null?Math.round(base.rain_probability)+'%':'—',park=base.park_lean||'—';document.getElementById('card').innerHTML='<div class="hero"><div class="date">'+esc(base.game_time||base.game_date||DATA.slate_date||'')+'</div><div class="title">MLB MATCHUP PREVIEW</div><div class="match"><div><img class="teamLogo" src="'+logo(away)+'"><div class="team">'+esc(away)+'</div></div><div class="vs">VS</div><div><img class="teamLogo" src="'+logo(home)+'"><div class="team">'+esc(home)+'</div></div></div><div class="venue">'+esc(base.venue||'BALLPARK')+'</div></div><div class="weather"><div><b>☀ '+temp+'</b>TEMP</div><div><b>💨 '+wind+'</b>WIND</div><div><b>💧 '+rain+'</b>RAIN</div><div><b>'+esc(park)+'</b>BALLPARK INDEX</div></div><div class="pitchers">'+pit(ap,away)+pit(hp,home)+'</div><div class="picks"><div class="picktitle">TOP HOME RUN PICKS</div>'+rows+'</div><div class="bottom"><div><b>KEY TAKEAWAYS</b>'+(reasons.length?reasons.map(function(r){return'<div class="why">• '+esc(r.replace(/_/g,' '))+'</div>'}).join(''):'<div class="why">• LaunchPoint model matchup signals</div>')+'</div><div class="slogan">GOOD VIBES<br><span>MORE HOMERS 👑</span><br>LAUNCHPOINT HR</div></div>'}function setup(){var tabs=document.getElementById('tabs');tabs.innerHTML='';GAMES.forEach(function(g,i){var ss=sides(g),b=document.createElement('button');b.textContent=ss[0]+' vs '+ss[1];b.onclick=function(){render(i)};tabs.appendChild(b)});var q=new URLSearchParams(location.search),pk=q.get('game_pk'),gk=q.get('game_key'),idx=0;if(pk){var f=GAMES.findIndex(function(g){return String(g.game_pk)===String(pk)});if(f>=0)idx=f}else if(gk){var f2=GAMES.findIndex(function(g){var ss=sides(g);return (ss[0]+' vs '+ss[1])===gk||(ss[1]+' vs '+ss[0])===gk});if(f2>=0)idx=f2}render(idx)}fetch('./data/todays_top_hr_picks.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(function(d){DATA=d;GAMES=group(d);if(!GAMES.length)throw Error('No games');setup()}).catch(function(e){document.getElementById('
