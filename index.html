<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LaunchPoint HR</title>
<style>
:root{--bg:#050d17;--panel:#0b1b2d;--line:#24435d;--white:#f7fbff;--muted:#8fa6bb;--red:#ef3340;--cyan:#21d4ff;--gold:#f4bd3f;--purple:#b260ff;--teal:#1fd0bd;--green:#31db8b}*{box-sizing:border-box}body{margin:0;background:#030912;color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:min(100%,520px);min-height:100vh;margin:auto;padding:18px 16px 94px;background:radial-gradient(circle at 10% 8%,#0b3155 0,transparent 28%),radial-gradient(circle at 94% 10%,#4a0c18 0,transparent 23%),linear-gradient(#071321,#030a12)}button{font:inherit;cursor:pointer}.top{display:flex;align-items:center;gap:10px;padding:10px 2px 17px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:linear-gradient(145deg,var(--red),#90101b);font-size:22px}.top h1{margin:0;font-size:20px;font-style:italic}.top h1 em{color:#ee5e89;font-style:normal}.top p{margin:2px 0 0;color:var(--muted);font-size:11px}.live{margin-left:auto;border:1px solid #29445c;background:#102338;padding:8px 10px;border-radius:99px;font-size:10px;font-weight:800}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}.periods,.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.periods button,.tabs button{color:#bccbd9;background:#091725;border:1px solid #233a4f;padding:10px 5px;border-radius:8px}.periods button.active{color:var(--cyan);border-color:var(--cyan);background:#0b2237}.periods b,.periods small{display:block}.periods b{font-size:11px}.periods small{font-size:8px;color:var(--muted);margin-top:3px}.top3{margin:13px 0 10px;padding:11px;border:1px solid #5a471c;border-radius:11px;background:#181507aa}.label{font-size:10px;font-weight:900;letter-spacing:.1em;color:var(--gold);margin-bottom:8px}.top-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.top-pick{display:flex;gap:7px;align-items:center;padding:8px;border:1px solid #38546c;border-radius:8px;background:#0b1928;min-width:0}.top-pick>strong{font-size:24px;color:var(--gold)}.top-pick span{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-pick span b{display:block;font-size:18px;color:var(--cyan)}.tabs{grid-template-columns:repeat(4,1fr);margin-bottom:10px}.tabs button{font-size:9px;font-weight:800}.tabs button.active{background:linear-gradient(90deg,#d21f2b,var(--red));color:#fff;border-color:var(--red)}#games{display:grid;gap:9px}.game{border:1px solid #27455e;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#0d2035,#07121e);box-shadow:0 10px 28px #0005}.game-head{width:100%;display:flex;justify-content:space-between;text-align:left;padding:12px 14px;border:0;color:#fff;background:linear-gradient(90deg,#0b2847,#111624 55%,#3a0d17)}.game-head b,.game-head small{display:block}.game-head b{font-size:17px}.game-head small{color:#b6c6d4;margin-top:4px}.body{padding:10px}.conditions{display:flex;justify-content:space-between;font-size:10px;padding:3px 2px 9px}.confirmed{color:var(--teal);font-weight:800}.pitchers{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pitchers div{padding:9px;border:1px solid var(--cyan);border-radius:7px;background:#0a1b2c}.pitchers div+div{border-color:var(--red);background:#211018}.pitchers small,.pitchers b{display:block}.pitchers small{font-size:8px;color:var(--muted)}.pitchers b{font-size:11px}.primary{display:grid;grid-template-columns:1.15fr .85fr;margin-top:8px;border:1px solid #856922;border-radius:9px;overflow:hidden;background:linear-gradient(120deg,#1c190c,#07121e)}.copy{padding:13px}.copy small{color:var(--gold);font-weight:900}.copy h2{font-size:21px;margin:10px 0}.copy span{font-size:10px;color:#aabac9}.copy span b{display:block;font-size:46px;line-height:1;color:var(--gold)}.copy em{display:inline-block;color:var(--gold);border:1px solid #a98525;border-radius:5px;padding:4px 7px;font-style:normal;font-size:10px}.field{width:100%;align-self:center}.grass{fill:#0e3d2e;stroke:#8d732a;stroke-width:2}.dirt{fill:#775131;stroke:#b78b44;stroke-width:1.5}.path{fill:none;stroke:#ffd15a;stroke-width:3;filter:drop-shadow(0 0 4px #ffd15a)}.ball{fill:white;stroke:#ffd15a;stroke-width:2}.ranks{display:grid;gap:5px;margin-top:7px}.rank{display:grid;grid-template-columns:32px 1fr 40px 56px;align-items:center;border:1px solid #2b5978;border-radius:7px;overflow:hidden;min-height:38px}.rank>strong{display:grid;place-items:center;height:100%;background:#0d3150;color:var(--cyan)}.rank span{padding-left:10px;font-size:12px;font-weight:800}.rank>b{font-size:20px;color:var(--cyan)}.rank em{font-size:9px;color:var(--cyan);font-style:normal}.rank.strong{border-color:#64427d}.rank.strong>strong{background:#302041;color:var(--purple)}.rank.strong>b,.rank.strong em{color:var(--purple)}.rank.value{border-color:#21685f}.rank.value>strong{background:#103a36;color:var(--teal)}.rank.value>b,.rank.value em{color:var(--teal)}.foot{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.foot>*{padding:10px;border:1px solid #31495c;border-radius:7px;background:#0a1622;color:#c1cfdb;font-size:9px;font-weight:800}.foot b{color:var(--gold);font-size:18px}.foot button{color:var(--cyan);border-color:#1c7586}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 10px 16px;background:#07121eef;border-top:1px solid #21384d}.bottom button{border:0;background:none;color:#8da2b6}.bottom small{display:block;font-size:8px}.bottom .active{color:var(--red)}.empty{padding:32px;text-align:center;color:var(--muted)}
/* Slate First palette — matched to the selected reference */
html,body{background:#000}
body{--bg:#01060b;--panel:#06111b;--line:#243543;--white:#f4f7f9;--muted:#8795a0;--red:#e52b32;--cyan:#29baff;--gold:#f2bd3c;--purple:#b765ef;--teal:#18c9b5;--green:#31d17c}
.shell{background:radial-gradient(ellipse at 50% 14%,rgba(8,39,62,.32) 0,rgba(2,12,20,.12) 37%,transparent 62%),linear-gradient(180deg,#02090f 0%,#01070c 50%,#02080d 100%)}
.periods button,.tabs button{background:#050c12;border-color:#1d2a34;color:#aeb8bf;box-shadow:inset 0 0 0 1px rgba(255,255,255,.015)}
.periods button.active{background:#06131e;border-color:#168bc9;color:#42beff;box-shadow:inset 0 0 14px rgba(29,157,220,.08),0 0 8px rgba(29,157,220,.07)}
.top3{background:linear-gradient(180deg,#100f09,#090b0d);border-color:#57451e}
.top-pick{background:#060d13}
.tabs button.active{background:linear-gradient(90deg,#991b20,#e32d32);border-color:#d62a30}
.game{background:linear-gradient(145deg,#07131d,#03090e);border-color:#2a3a47;box-shadow:0 10px 28px #000b}
.game-head{background:linear-gradient(90deg,#06131d,#030a10 58%,#071019)}
.body{background:#030a10}
.pitchers div{background:#06131d}.pitchers div+div{background:#16090c}
.primary{background:linear-gradient(120deg,#171307,#030a0f)}
.rank{background:#040c12}
.foot>*{background:#050c12}
.bottom{background:rgba(2,8,13,.97);border-color:#182630}
</style>
</head><body><main class="shell">
<header class="top"><div class="logo">⚾</div><div><h1>LAUNCHPOINT <em>HR</em></h1><p>MLB Home Run Intelligence</p></div><span class="live">MODEL LIVE</span></header>
<section class="periods"><button data-period="early"><b>EARLY</b><small>12 PM – 3 PM</small></button><button data-period="afternoon"><b>AFTERNOON</b><small>3 PM – 7 PM</small></button><button class="active" data-period="night"><b>NIGHT</b><small>7 PM – LATE</small></button></section>
<section class="top3"><div class="label">DAILY TOP 3 · HR EDGE</div><div class="top-grid" id="top3"></div></section>
<nav class="tabs"><button class="active">BY GAME</button><button>TOP PICKS</button><button>ELITE</button><button>CONFIRMED</button></nav><section id="games"><div class="empty">Loading today’s matchups…</div></section>
<nav class="bottom"><button class="active">⌂<small>HOME</small></button><button>▤<small>GAMES</small></button><button>♕<small>TOP PICKS</small></button><button>◇<small>WATCHLIST</small></button><button>•••<small>MORE</small></button></nav></main>
<script>
let allPlayers=[],period="night",openKey=null;
const n=v=>Number(v)||0, esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const displayName=name=>{const p=String(name||"").split(",");return p.length>1?`${p[1].trim()} ${p[0].trim()}`:name||"Unknown"};
const keyFor=p=>p.game_pk?String(p.game_pk):[p.team,p.opponent].sort().join("|");
const gamePeriod=t=>{if(!t)return "night";const m=String(t).match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/i);if(!m)return "night";let h=+m[1];if((m[3]||"").toUpperCase()==="PM"&&h<12)h+=12;return h<15?"early":h<19?"afternoon":"night"};
function groups(){const map={};allPlayers.forEach(p=>(map[keyFor(p)]??=[]).push(p));return Object.entries(map).map(([key,players])=>({key,players:players.sort((a,b)=>n(b.daily_percentile)-n(a.daily_percentile)).slice(0,4)}));}
function starterFor(team,ps){return ps.find(p=>p.opponent===team)?.pitcher||"Starter TBD"}
function field(){return `<svg class="field" viewBox="0 0 210 170" role="img" aria-label="Mini Field Map"><title>Mini Field Map</title><path class="grass" d="M105 160 L18 78 Q105 2 192 78 Z"/><path class="dirt" d="M105 151 L61 111 L105 68 L149 111 Z"/><path class="path" d="M105 150 Q127 58 181 23"/><circle class="ball" cx="181" cy="23" r="5"/></svg>`}
function render(){const gs=groups();const top=[...allPlayers].sort((a,b)=>n(b.daily_percentile)-n(a.daily_percentile)).slice(0,3);document.querySelector("#top3").innerHTML=top.map((p,i)=>`<div class="top-pick"><strong>${i+1}</strong><span>${esc(displayName(p.player))}<b>${n(p.daily_percentile).toFixed(1)}</b></span></div>`).join("");const shown=gs.filter(g=>gamePeriod(g.players[0]?.game_time)===period);if(!shown.length){document.querySelector("#games").innerHTML='<div class="empty">No games in this time window yet.</div>';return}if(!openKey)openKey=shown[0].key;document.querySelector("#games").innerHTML=shown.map(g=>{const p=g.players[0],teams=[p.team,p.opponent],expanded=g.key===openKey,rating=Math.round(g.players.reduce((s,x)=>s+n(x.daily_percentile),0)/g.players.length),confirmed=p.lineup_status==="CONFIRMED"||n(p.starter_confirmed)===1;return `<article class="game"><button class="game-head" data-key="${esc(g.key)}"><span><b>${esc(teams[0])} vs ${esc(teams[1])}</b><small>${esc(p.game_time||"Time TBD")} · ${esc(p.venue||"Venue TBD")}</small></span><span>${expanded?'⌃':'⌄'}</span></button>${expanded?`<div class="body"><div class="conditions"><span>${p.temperature?`☀ ${n(p.temperature).toFixed(0)}° · Wind ${n(p.wind_speed).toFixed(0)} MPH`:"Conditions pending"}</span><span class="confirmed">✓ ${confirmed?"LINEUPS CONFIRMED":"LINEUPS PENDING"}</span></div><div class="pitchers"><div><small>${esc(teams[0])} STARTER</small><b>${esc(starterFor(teams[0],g.players))}</b></div><div><small>${esc(teams[1])} STARTER</small><b>${esc(starterFor(teams[1],g.players))}</b></div></div><div class="primary"><div class="copy"><small>★ PRIMARY LAUNCH</small><h2>${esc(displayName(p.player))}</h2><span>HR EDGE <b>${n(p.daily_percentile).toFixed(1)}</b></span><em>◇ ${esc(p.daily_tier||"ELITE")}</em></div>${field()}</div><div class="ranks">${g.players.slice(1).map((x,i)=>`<div class="rank ${(x.daily_tier||'').toLowerCase()}"><strong>${i+2}</strong><span>${esc(displayName(x.player))}</span><b>${n(x.daily_percentile).toFixed(1)}</b><em>${esc(x.daily_tier)}</em></div>`).join("")}</div><div class="foot"><span>LAUNCH RATING <b>${rating}</b></span><button>VIEW MATCHUP DETAILS →</button></div></div>`:""}</article>`}).join("");document.querySelectorAll(".game-head").forEach(b=>b.onclick=()=>{openKey=openKey===b.dataset.key?null:b.dataset.key;render()})}
document.querySelectorAll("[data-period]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-period]").forEach(x=>x.classList.remove("active"));b.classList.add("active");period=b.dataset.period;openKey=null;render()});
fetch("data/todays_top_hr_picks.json?ts="+Date.now()).then(r=>r.json()).then(d=>{allPlayers=d.players||[];render()}).catch(()=>{document.querySelector("#games").innerHTML='<div class="empty">Today’s model data is not available yet.</div>'});
</script></body></html>
